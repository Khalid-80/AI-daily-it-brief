name: AI Daily IT Intelligence Brief

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

jobs:
  build:
    name: Collect + Analyze (RSS -> AI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate brief
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_brief.py
      - name: Upload brief as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: |
            brief.md
            brief.json
          retention-days: 7

  publish:
    name: Human review + Publish to Teams
    needs: build
    runs-on: ubuntu-latest
    environment: teams-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download brief artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-brief
      - name: Publish to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/publish_to_teams.py
